<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Minigolf Party · Controller</title>
    <style>
      :root { --ink: #1f3247; --soft: #5a6f85; --font: ui-rounded, 'SF Pro Rounded', system-ui, sans-serif; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: var(--font); color: var(--ink);
        background: linear-gradient(#8fd3ff, #d9f2ff);
        -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
      }
      section {
        min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column;
        justify-content: center; align-items: center; text-align: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      }
      section[hidden] { display: none; }
      h1 { margin: 0 0 8px; font-size: 34px; font-weight: 900; }
      p { margin: 8px 0; font-size: 20px; color: var(--soft); max-width: 340px; }
      label { display: block; font-size: 20px; font-weight: 800; margin: 20px 0 8px; }
      input {
        font: inherit; font-size: 26px; font-weight: 700; text-align: center; color: var(--ink);
        width: 100%; max-width: 320px; box-sizing: border-box; padding: 14px; border-radius: 18px;
        border: 4px solid #ffffff; background: #ffffff; outline: none; -webkit-user-select: text; user-select: text;
      }
      input:focus { border-color: #00a6ed; }
      #colours { display: grid; grid-template-columns: repeat(3, 64px); gap: 14px; justify-content: center; }
      .swatch { width: 64px; height: 64px; border-radius: 50%; border: 5px solid #ffffff; padding: 0; }
      .swatch.selected { box-shadow: 0 0 0 5px var(--ink); }
      .swatch:disabled { opacity: 0.25; }
      button.big {
        font: inherit; font-size: 30px; font-weight: 900; color: #ffffff; background: #3ec300;
        border: none; border-radius: 24px; padding: 20px 0; width: 100%; max-width: 320px; margin-top: 28px;
        box-shadow: 0 8px 0 #2b8a00;
      }
      button.big:active { transform: translateY(6px); box-shadow: 0 2px 0 #2b8a00; }
      button.link { font: inherit; font-size: 18px; color: var(--soft); background: none; border: none; text-decoration: underline; margin-top: 24px; }
      .error { color: #d93a3f; font-weight: 700; min-height: 1.4em; }
      input.code { font-size: 44px; letter-spacing: 12px; text-transform: uppercase; }
      input.code::placeholder { color: #c9d6e2; }
      #me-dot { width: 120px; height: 120px; border-radius: 50%; border: 8px solid #ffffff; margin-bottom: 20px; }
      #reconnecting {
        position: fixed; top: 0; left: 0; right: 0; padding: max(10px, env(safe-area-inset-top)) 10px 10px;
        background: #ff5a5f; color: #ffffff; font-size: 18px; font-weight: 800; text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="reconnecting" hidden>Reconnecting…</div>

    <section id="screen-message">
      <h1 id="message-title">Connecting…</h1>
      <p id="message-text"></p>
    </section>

    <section id="screen-room" hidden>
      <h1>Minigolf Party</h1>
      <form id="room-form" autocomplete="off">
        <label for="room-code">Room code</label>
        <input id="room-code" class="code" maxlength="4" inputmode="text" enterkeyhint="go" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="ABCD" />
        <p>You can find it on the big screen.</p>
        <button class="big" type="submit">Next</button>
        <p id="room-error" class="error"></p>
      </form>
    </section>

    <section id="screen-join" hidden>
      <h1>Minigolf Party</h1>
      <form id="join-form" autocomplete="off">
        <label for="name">Your name</label>
        <input id="name" maxlength="12" enterkeyhint="done" autocapitalize="words" spellcheck="false" />
        <label>Shirt colour</label>
        <div id="colours"></div>
        <button class="big" type="submit">Join</button>
        <p id="join-error" class="error"></p>
      </form>
    </section>

    <section id="screen-joined" hidden>
      <div id="me-dot"></div>
      <h1 id="me-name"></h1>
      <p>You're in! Look at the big screen.</p>
      <p id="wake-tip" hidden>Tip: this phone may lock its screen during the game. You can turn off Auto-Lock in Settings.</p>
      <button class="link" id="change-profile" type="button">Change name or colour</button>
    </section>

    <script type="module" src="/controller/main.ts"></script>
  </body>
</html>
