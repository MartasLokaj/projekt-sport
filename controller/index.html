<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Minigolf Party · Controller</title>
    <style>
      :root { --ink: #1f3247; --soft: #5a6f85; --font: ui-rounded, 'SF Pro Rounded', system-ui, sans-serif; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: var(--font); color: var(--ink);
        background: linear-gradient(#8fd3ff, #d9f2ff);
        -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
      }
      section {
        min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column;
        justify-content: center; align-items: center; text-align: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      }
      section[hidden] { display: none; }
      h1 { margin: 0 0 8px; font-size: 34px; font-weight: 900; }
      p { margin: 8px 0; font-size: 20px; color: var(--soft); max-width: 340px; }
      label { display: block; font-size: 20px; font-weight: 800; margin: 20px 0 8px; }
      input {
        font: inherit; font-size: 26px; font-weight: 700; text-align: center; color: var(--ink);
        width: 100%; max-width: 320px; box-sizing: border-box; padding: 14px; border-radius: 18px;
        border: 4px solid #ffffff; background: #ffffff; outline: none; -webkit-user-select: text; user-select: text;
      }
      input:focus { border-color: #00a6ed; }
      #colours { display: grid; grid-template-columns: repeat(3, 64px); gap: 14px; justify-content: center; }
      .swatch { width: 64px; height: 64px; border-radius: 50%; border: 5px solid #ffffff; padding: 0; }
      .swatch.selected { box-shadow: 0 0 0 5px var(--ink); }
      .swatch:disabled { opacity: 0.25; }
      button.big {
        font: inherit; font-size: 30px; font-weight: 900; color: #ffffff; background: #3ec300;
        border: none; border-radius: 24px; padding: 20px 0; width: 100%; max-width: 320px; margin-top: 28px;
        box-shadow: 0 8px 0 #2b8a00;
      }
      button.big:active { transform: translateY(6px); box-shadow: 0 2px 0 #2b8a00; }
      button.link { font: inherit; font-size: 18px; color: var(--soft); background: none; border: none; text-decoration: underline; margin-top: 24px; }
      .error { color: #d93a3f; font-weight: 700; min-height: 1.4em; }
      input.code { font-size: 44px; letter-spacing: 12px; text-transform: uppercase; }
      input.code::placeholder { color: #c9d6e2; }
      #screen-play { justify-content: flex-start; align-items: stretch; gap: 12px; height: 100%; }
      #play-header { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 900; }
      #play-header .link { margin: 0 0 0 auto; }
      #me-dot { width: 36px; height: 36px; border-radius: 50%; border: 4px solid #ffffff; flex: 0 0 auto; }
      #aim-pad {
        flex: 1 1 0; min-height: 150px; border-radius: 28px; background: rgba(255, 255, 255, 0.7);
        display: flex; flex-direction: column; align-items: center; justify-content: center; touch-action: none;
      }
      #aim-arrow { font-size: 72px; line-height: 1; color: var(--ink); }
      #aim-value { font-size: 28px; font-weight: 900; margin-top: 6px; }
      #aim-pad .hint { font-size: 17px; color: var(--soft); margin-top: 4px; }
      #power { position: relative; height: 34px; border-radius: 17px; background: rgba(255, 255, 255, 0.7); overflow: hidden; }
      #power-fill { height: 100%; width: 0; background: linear-gradient(90deg, #3ec300, #ffb400 60%, #ff5a5f); transition: width 0.05s; }
      #power-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; }
      #swing-area { flex: 1.5 1 0; min-height: 250px; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
      #practice-button {
        flex: 0 0 64px; width: 100%; border: 4px dashed #ff8a3d; border-radius: 24px; background: rgba(255, 255, 255, 0.75);
        color: #c95f1a; font: inherit; font-size: 22px; font-weight: 900;
        touch-action: none; -webkit-touch-callout: none; transform: translateY(var(--pull, 0px));
      }
      #practice-button[hidden] { display: none; }
      #practice-button.held { background: #ffe2cc; }
      #practice-button.slingshot { border-color: #00a6ed; color: #0077aa; }
      #swing-button {
        flex: 1; width: 100%; border: none; border-radius: 32px; background: #ff8a3d; color: #ffffff;
        font: inherit; font-size: 34px; font-weight: 900; box-shadow: 0 10px 0 #c95f1a;
        touch-action: none; -webkit-touch-callout: none; transform: translateY(var(--pull, 0px));
      }
      #swing-button[hidden] { display: none; }
      #swing-button.held { background: #ff6a1a; box-shadow: 0 3px 0 #c95f1a; }
      #swing-button.slingshot { background: #00a6ed; box-shadow: 0 10px 0 #0077aa; }
      #swing-button.slingshot.held { box-shadow: 0 3px 0 #0077aa; }
      #motion-panel { display: flex; flex-direction: column; align-items: center; }
      #motion-panel[hidden] { display: none; }
      #play-status { margin: 0 auto; min-height: 1.4em; font-weight: 800; color: var(--ink); }
      #screen-play > .link { margin: 0 auto; }
      #wake-tip { margin: 0 auto; font-size: 15px; }
      #screen-play { position: relative; }
      #turn-overlay {
        position: absolute; left: 0; right: 0; bottom: 0; top: calc(max(24px, env(safe-area-inset-top)) + 52px);
        display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        padding: 24px; background: linear-gradient(#d9f2ff, #b8e6ff); border-radius: 28px 28px 0 0;
      }
      #turn-overlay[hidden] { display: none; }
      #reconnecting {
        position: fixed; top: 0; left: 0; right: 0; padding: max(10px, env(safe-area-inset-top)) 10px 10px;
        background: #ff5a5f; color: #ffffff; font-size: 18px; font-weight: 800; text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="reconnecting" hidden>Reconnecting…</div>

    <section id="screen-message">
      <h1 id="message-title">Connecting…</h1>
      <p id="message-text"></p>
    </section>

    <section id="screen-room" hidden>
      <h1>Minigolf Party</h1>
      <form id="room-form" autocomplete="off">
        <label for="room-code">Room code</label>
        <input id="room-code" class="code" maxlength="4" inputmode="text" enterkeyhint="go" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="ABCD" />
        <p>You can find it on the big screen.</p>
        <button class="big" type="submit">Next</button>
        <p id="room-error" class="error"></p>
      </form>
    </section>

    <section id="screen-join" hidden>
      <h1>Minigolf Party</h1>
      <form id="join-form" autocomplete="off">
        <label for="name">Your name</label>
        <input id="name" maxlength="12" enterkeyhint="done" autocapitalize="words" spellcheck="false" />
        <label>Shirt colour</label>
        <div id="colours"></div>
        <button class="big" type="submit">Join</button>
        <p id="join-error" class="error"></p>
      </form>
    </section>

    <section id="screen-play" hidden>
      <header id="play-header">
        <span id="me-dot"></span>
        <span id="me-name"></span>
        <button class="link" id="change-profile" type="button">Edit</button>
      </header>

      <div id="aim-pad">
        <div id="aim-arrow">▲</div>
        <div id="aim-value">0°</div>
        <div class="hint">Drag left or right to aim</div>
      </div>

      <div id="power"><div id="power-fill"></div><span id="power-text">0%</span></div>

      <div id="swing-area">
        <button id="practice-button" type="button">Tap for a practice swing</button>
        <button id="swing-button" type="button"><span id="swing-label">TAP TO SWING</span></button>
        <div id="motion-panel" hidden>
          <p id="motion-text"></p>
          <button class="big" id="motion-enable" type="button">Enable motion</button>
        </div>
      </div>

      <p id="play-status"></p>
      <button class="link" id="mode-toggle" type="button">Use touch controls instead</button>
      <p id="wake-tip" hidden>Tip: this phone may lock its screen during the game. You can turn off Auto-Lock in Settings.</p>

      <div id="turn-overlay" hidden>
        <h1 id="turn-title"></h1>
        <p id="turn-text"></p>
        <button class="big" id="turn-button" type="button" hidden></button>
        <button class="link" id="turn-edit" type="button" hidden>Change name or colour</button>
      </div>
    </section>

    <script type="module" src="/controller/main.ts"></script>
  </body>
</html>
