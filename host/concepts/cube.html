<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cube World concepts</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; font-family: ui-rounded, 'SF Pro Rounded', system-ui, sans-serif; }
      #view { position: fixed; inset: 0; }
      .tag { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); padding: 8px 18px; border-radius: 999px;
        background: rgba(255,255,255,0.85); color: #1d2a44; font-weight: 800; font-size: 18px; box-shadow: 0 4px 14px rgba(0,0,0,0.15); }
      .room { position: fixed; top: 16px; left: 16px; width: 150px; padding: 14px; border-radius: 22px; text-align: center;
        background: #fff; color: #1d2a44; box-shadow: 0 6px 18px rgba(0,0,0,0.18); font-weight: 700; }
      .qr { width: 122px; height: 122px; margin: 0 auto 8px; border-radius: 10px;
        background: repeating-conic-gradient(#1d2a44 0 25%, #fff 0 50%) 0 0 / 20px 20px; opacity: 0.85; }
      .game { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); text-align: center; padding: 14px 30px;
        border-radius: 26px; background: rgba(255,255,255,0.9); color: #1d2a44; box-shadow: 0 6px 18px rgba(0,0,0,0.18); }
      .game h1 { margin: 0; font-size: 34px; }
      .game p { margin: 4px 0 10px; font-size: 16px; color: #4b5a78; }
      .game button { font: inherit; font-weight: 800; font-size: 18px; border: 0; border-radius: 999px; padding: 8px 28px;
        background: #58c25a; color: #fff; box-shadow: 0 4px 0 #3c9a3f; }
      .switch { position: fixed; top: 16px; right: 16px; display: flex; gap: 6px; }
      .switch a { padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,0.75); color: #1d2a44; text-decoration: none; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div class="tag" id="tag"></div>
    <div class="room"><div class="qr"></div>Room <b>ABCD</b></div>
    <div class="game"><h1>Minigolf</h1><p>Putt across tiny islands · 1–4 players</p><button>Play (Enter)</button></div>
    <div class="switch"><a href="?v=sky">A</a><a href="?v=space">B</a><a href="?v=sunset">C</a></div>
    <script type="module" src="./cube.ts"></script>
  </body>
</html>
